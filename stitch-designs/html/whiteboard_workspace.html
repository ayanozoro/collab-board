<script>
        // Simple micro-interactions
        const minimapToggle = document.getElementById('minimap-toggle');
        const minimap = document.getElementById('minimap');
        let isMinimapVisible = false;

        minimapToggle.addEventListener('click', () => {
            isMinimapVisible = !isMinimapVisible;
            minimap.style.opacity = isMinimapVisible ? '1' : '0';
        });

        // Simulate moving cursors slightly for realism
        const cursors = {
            alex: { el: document.getElementById('cursor-alex'), x: 45, y: 35 },
            sarah: { el: document.getElementById('cursor-sarah'), x: 55, y: 60 }
        };

        setInterval(() => {
            Object.keys(cursors).forEach(id => {
                const c = cursors[id];
                c.x += (Math.random() - 0.5) * 1.5;
                c.y += (Math.random() - 0.5) * 1.5;
                c.el.style.left = `${c.x}%`;
                c.el.style.top = `${c.y}%`;
            });
        }, 150);

        // Canvas Zoom interaction logic (Visual Only)
        let zoom = 100;
        const zoomDisplay = document.querySelector('span.min-w-\\[48px\\]');
        document.querySelectorAll('footer button').forEach(btn => {
            btn.addEventListener('click', () => {
                const text = btn.querySelector('span')?.textContent;
                if(text === 'add') {
                    zoom = Math.min(zoom + 10, 400);
                    zoomDisplay.textContent = `${zoom}%`;
                } else if(text === 'remove') {
                    zoom = Math.max(zoom - 10, 10);
                    zoomDisplay.textContent = `${zoom}%`;
                }
            });
        });
    </script>
